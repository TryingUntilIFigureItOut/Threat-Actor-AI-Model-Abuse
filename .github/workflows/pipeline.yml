name: CTI AI Model Abuse Pipeline

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: pip install feedparser pypdf groq python-dotenv

      - name: Fetch & Process Threat Reports
        run: python "CTI AI Model Abuse Pipeline.py"

      - name: Generate AI Detections
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python analyze_reports.py