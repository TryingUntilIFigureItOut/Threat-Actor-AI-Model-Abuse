name: CTI AI Model Abuse Pipeline

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:

# Grant write permissions to commit generated rules and DB back to the repository
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install feedparser pypdf groq python-dotenv

      - name: Run Ingestion
        run: python "CTI AI Model Abuse Pipeline.py"

      - name: Run AI Analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python analyze_reports.py

      - name: Commit and Push Database and Rules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/ AI_Model_Abuse.db
          git commit -m "Auto-update database and detection rules" || echo "No changes to commit"
          git push